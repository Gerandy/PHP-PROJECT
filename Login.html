<!DOCTYPE html>
<html>
    <head>
        <title> Employee Dashboard </title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/Login.css">
    </head>

    <body class="body">
        <div class="container Whole_Window">
            
            <div class="image-container">
                <img src="assets/images/HandShake.jpg" class="SlideShow">
            </div>

            <div class="content-container">
                <div class="Text_Container">
                    <span class="Swift_Text"> SWIFT </span> 
                    <span class="Pay_Text"> PAY </span>
                    <p class="Tagline"> Payday, Your Way</p>
                </div>

                <div class="LogIn_Box">
                    <form>
                        <label class="sr-only">User ID</label>
                        <input type="text" placeholder="User ID:" class="input_UserID">
                        <br>
                        <label class="sr-only">Email</label>
                        <input type="email" placeholder="Email:" class="input">
                        <br>
                        <label class="sr-only">Password</label>
                        <input type="password" placeholder="Password:" class="input">
                        <br>
                        <input type="checkbox">
                        <label class="Text"> Remember Me </label>
                        <a href="#" class="Forgot_Password_Link" onclick="openForm()"> Forgot Password? </a>
                        <br>
                        <button type="submit" class="LogIn_Button"> LOGIN </button>
                    </form>
                </div>

                <div class="Text_Container_for_Link">
                    <span class="Swift_Text_Footer"> SWIFT </span> 
                    <span class="Pay_Text_Footer"> PAY </span>
                    <span style="color: #B4C8C7;"> | </span>
                    <a href="#" class="AboutUs_Link"> About Us </a>
                </div>
            </div>
        </div>

        <!-- Try Pop Up -->
        <!-- Pop Up Form -->

        <div class="form-popup" id="myForm">
            <form action="/action_page.php" class="form-container">
              <h1>Login</h1>
          
              <label for="email"><b>Email</b></label>
              <input type="text" placeholder="Enter Email" name="email" required>
          
              <label for="psw"><b>Password</b></label>
              <input type="password" placeholder="Enter Password" name="psw" required>
          
              <button type="submit" class="btn">Login</button>
              <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
            </form>
        </div>


        <!-- Javascript for Pop Up -->
        <script>
            function openForm() {
              document.getElementById("myForm").style.display = "block";
            }
            
            function closeForm() {
              document.getElementById("myForm").style.display = "none";
            }
        </script>

    </body>


</html>
